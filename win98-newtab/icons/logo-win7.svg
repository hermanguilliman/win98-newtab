<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Windows 7 Start orb: bright aqua/blue glassy sphere with the 4-color flag inside -->
  <defs>
    <radialGradient id="win7-orb" cx="0.34" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#D6F0FF"/>
      <stop offset="0.45" stop-color="#4FA3E8"/>
      <stop offset="1" stop-color="#0A4E9E"/>
    </radialGradient>
  </defs>
  <circle cx="8" cy="8" r="7.2" fill="url(#win7-orb)"/>
  <!-- inner flag panes (wide wave like Win7) -->
  <path d="M3.4 3.8h3v5.8c-1.2 1.2-2.3 2-3 2.6z" fill="#E81123" opacity="0.95"/>
  <path d="M7.4 3.8h5.2l-1.8 8.4H6.8c.8-2.6.6-5.8.6-8.4z" fill="#5CB85C" opacity="0.95"/>
  <path d="M3.4 10.4c-.8.5-1.4.8-2 1.2l.8 3.2h3.6c-1.2-1-2-2.6-2.4-4.4z" fill="#3B78FF" opacity="0.95"/>
  <path d="M8.6 12.3c.4 1.4.6 2.6.5 3.7H14c.6-2.6.4-5-.8-3.7z" fill="#FFB900" opacity="0.95"/>
  <!-- glass highlights -->
  <ellipse cx="5" cy="3.6" rx="4" ry="2" fill="#fff" opacity="0.75" transform="rotate(-22 5 3.6)"/>
  <circle cx="8" cy="8" r="7.4" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.6"/>
</svg>