<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Windows 7 Start orb: glossy green-blue sphere with white flag -->
  <defs>
    <radialGradient id="win7-orb" cx="0.32" cy="0.26" r="0.98">
      <stop offset="0" stop-color="#EAFAD9"/>
      <stop offset="0.5" stop-color="#8FD04A"/>
      <stop offset="1" stop-color="#0F7A1B"/>
    </radialGradient>
  </defs>
  <circle cx="8" cy="8" r="7.2" fill="url(#win7-orb)"/>
  <circle cx="8" cy="8" r="7.2" fill="none" stroke="#F2FFF2" stroke-width="0.6" opacity="0.6"/>
  <!-- flag panes (curved like Win7) -->
  <g opacity="0.95">
    <path d="M3.8 4.6h2.7v2.6H3.8z" fill="#fff"/>
    <path d="M8.2 4.6h2.7l-1.1 2.6H8.2z" fill="#fff"/>
    <path d="M3.8 8h2.7v2.6H3.8z" fill="#fff"/>
    <path d="M8.2 8h1.1l-1.1 2.6H8.2z" fill="#fff"/>
  </g>
  <!-- gloss -->
  <ellipse cx="5.2" cy="3.6" rx="3.8" ry="2" fill="#fff" opacity="0.65" transform="rotate(-22 5.2 3.6)"/>
</svg>