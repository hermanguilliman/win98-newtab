  <!-- flag panes -->
  <g opacity="0.92">
    <path d="M4.2 5.1h2.9v2.7H4.2z" fill="#fff"/>
    <path d="M8 5.1h2.9v2.7H8z" fill="#fff"/>
    <path d="M4.2 8.5h2.9v2.7H4.2z" fill="#fff"/>
