      <stop offset="0" stop-color="#C5ECFF"/>
      <stop offset="0.45" stop-color="#3E9BE8"/>
      <stop offset="1" stop-color="#0A3E8F"/>
    </radialGradient>
  </defs>
  <circle cx="8" cy="8.2" r="7.2" fill="url(#vista-orb)"/>
