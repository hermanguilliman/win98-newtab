<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новый адрес</title>
  <link rel="stylesheet" href="win98.css?v=14">
</head>

<body>
  <!-- Desktop -->
  <div id="desktop">
    <div id="desktop-icons"></div>
  </div>

  <!-- Open Windows Container -->
  <div id="windows-container"></div>

  <!-- Taskbar -->
  <div id="taskbar">
    <button id="start-btn" class="win98-btn">
      <img src="icons/logo.svg" alt="" class="start-logo" width="16" height="16">
      <span>Пуск</span>
    </button>
    <div id="taskbar-divider"></div>
    <div id="taskbar-windows"></div>
    <div id="system-tray">
      <div id="tray-icons"></div>
      <div id="weather"></div>
      <div id="clock"></div>
    </div>
  </div>

  <!-- Start Menu -->
  <div id="start-menu" class="win98-window" style="display:none;">
    <div class="start-menu-sidebar">
      <span class="start-menu-sidebar-text"><strong>Windows</strong>98</span>
    </div>
    <div class="start-menu-content">
      <div class="start-menu-item" id="menu-all-bookmarks">
        <img src="icons/folder-open.svg" alt="" width="32" height="32">
        <div>
          <div class="start-menu-item-title">Все закладки</div>
          <div class="start-menu-item-desc">Открыть менеджер закладок</div>
        </div>
      </div>
      <div class="start-menu-item" id="menu-search">
        <img src="icons/search.svg" alt="" width="32" height="32">
        <div>
          <div class="start-menu-item-title">Поиск</div>
          <div class="start-menu-item-desc">Найти закладку</div>
        </div>
      </div>
      <div class="start-menu-separator"></div>
      <div class="start-menu-item" id="menu-settings">
        <img src="icons/settings.svg" alt="" width="32" height="32">
        <div>
          <div class="start-menu-item-title">Настройки</div>
          <div class="start-menu-item-desc">Настроить рабочий стол</div>
        </div>
      </div>
    </div>
  </div>

  <script src="newtab.js?v=14"></script>
</body>

</html>
