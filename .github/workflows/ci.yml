name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (app shell + strict libs)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Build bundle (esbuild → win98-newtab/newtab.js)
        run: npm run build

      - name: Syntax-check the artifact Chrome will load
        run: node --check win98-newtab/newtab.js